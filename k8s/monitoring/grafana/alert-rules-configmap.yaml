apiVersion: v1
data:
  alert-rules.yaml: |
    apiVersion: 1
    groups:
        - orgId: 1
          name: logiflow
          folder: LogiFlow
          interval: 1m
          rules:
            - uid: eg4rkmwat46psd
              title: LogiFlow HTTP errors
              condition: C
              data:
                - refId: A
                  queryType: instant
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: bg4rkdy81xpfkb
                  model:
                    datasource:
                        type: loki
                        uid: bg4rkdy81xpfkb
                    editorMode: code
                    expr: sum(count_over_time({namespace="default", app="logiflow-wms"} |~ " [45][0-9]{2} " [5m]))
                    instant: true
                    intervalMs: 1000
                    maxDataPoints: 43200
                    queryType: instant
                    refId: A
                - refId: C
                  queryType: expression
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 0
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: OK
              execErrState: Error
              for: 1m
              annotations: {}
              labels: {}
              isPaused: false
              notification_settings:
                receiver: logiflow-email
            - uid: dg4rlgyco5xc0a
              title: LogiFlow memory high
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: max(container_memory_working_set_bytes{namespace="default",pod=~"logiflow-wms-.*"})
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  queryType: expression
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 1.048576e+08
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 1m
              annotations:
                description: Alerts when LogiFlow WMS pod memory stays above 100 MiB.
                summary: Container memory usage exceeds 100 MiB
              isPaused: false
              notification_settings:
                receiver: logiflow-email
kind: ConfigMap
metadata:
  name: logiflow-alert-rules
  namespace: monitoring
