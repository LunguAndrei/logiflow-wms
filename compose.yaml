services:
  api:
    image: ghcr.io/lunguandrei/logiflow-wms:latest
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_PATH: /data/logiflow.db
    volumes:
      - logiflow-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
volumes:
  logiflow-data:
